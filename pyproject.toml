[build-system]
# PINNED, and the pin is load-bearing: hatchling>=1.28 emits
# Metadata-Version 2.5, which PyPI REJECTS on upload. Unpinned, the
# metadata version depends on whenever the builder last resolved
# hatchling -- so the build is reproducible only by accident. Raise this
# ceiling only after confirming PyPI accepts the metadata version the
# newer hatchling emits.
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[project]
name = "nucleus-mcp"
version = "1.16.9"
description = "Sovereign Agent OS — Persistent Memory, Governance & Compliance for AI Agents"
readme = "README.md"
authors = [
    { name = "Nucleus Team", email = "hello@nucleusos.dev" }
]
# PyPI rejects any non-http(s) URL here: a "mailto:" Contact entry made every
# release fail with 400 "is not a valid url" and sat undetected for six weeks
# because nobody published. See tests/test_pyproject_dependency_hygiene.py.
urls = { Homepage = "https://nucleusos.dev" }
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "fastmcp",
    "cffi",
    "curl_cffi>=0.15.0",
    "watchdog>=6.0.0",
    "google-cloud-firestore>=2.26.0",
    "duckduckgo-search>=8.1.1",
    "beautifulsoup4>=4.14.3",
    "nest_asyncio",
    "pyyaml>=6.0.3",
    "xattr; sys_platform != 'win32'",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
    "rank-bm25>=0.2",
    "filelock>=3.20.3",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    # Transitive, floored EXPLICITLY. Neither is imported directly; both arrived
    # via other packages and the lockfile pinned them on versions carrying five
    # HIGH advisories between them. A check over DECLARED dependencies could not
    # see either -- 29 declared floors vs 137 locked packages.
    #   mcp<1.28.1       GHSA-jpw9-pfvf-9f58 HTTP transports serve session
    #                    requests without verifying the authenticated session;
    #                    GHSA-vj7q-gjh5-988w no Host/Origin validation on the
    #                    WebSocket transport; GHSA-hvrp-rf83-w775 task handlers
    #   soupsieve<2.9.0  GHSA-2wc2-fm75-p42x memory exhaustion;
    #                    GHSA-836r-79rf-4m37 ReDoS in the selector parser;
    #                    GHSA-gjv8-xp57-g29c and GHSA-j934-xhv5-fg8f, both
    #                    polynomial-time ReDoS, still affect 2.8.4 and are fixed
    #                    in 2.9.0 -- raised 2026-09-18 after GATE7 flagged the
    #                    DECLARED floor while the resolved env (2.9.2) read clean
    "mcp>=1.28.1",
    "soupsieve>=2.9.0",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "lxml>=6.1.0",
    "agent-client-protocol>=0.12.1",
]

[project.optional-dependencies]
full = [
    "fastmcp>=3.2.0",
    "google-genai",
    "ag-cc-proxy>=0.1.0"
]
postgres = [
    "psycopg2-binary"
]
http = [
    "uvicorn[standard]>=0.29.0",
    "starlette>=1.3.1",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.32",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout",
    "pytest-benchmark",
    "aiohttp>=3.14.3",
    "ruff"
]

[project.scripts]
nucleus-mcp = "mcp_server_nucleus:main"
nucleus = "mcp_server_nucleus.cli:main"
nucleus-init = "mcp_server_nucleus.cli:main"
nucleus-wedge = "nucleus_wedge.__main__:main"
nucleus-mcp-http = "mcp_server_nucleus.http_transport.server:main"
nucleus-mcp-cloud = "mcp_server_nucleus.http_transport.app:serve"
nucleus-relay-bridge = "mcp_server_nucleus.runtime.relay.bridge:main"
nucleus-rabbithole = "mcp_server_nucleus.rabbithole.server:main"
nucleus-ag-cc-proxy = "mcp_server_nucleus.runtime.ag_cc_proxy:main"
nucleus-work = "mcp_server_nucleus.runs.cli:main"
nucleus-run-worker = "mcp_server_nucleus.runs.worker_main:main"
nucleus-acp = "mcp_server_nucleus.runs.acp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_nucleus", "src/nucleus_wedge"]
# Withheld modules. These two lines were the entire wheel config for 33 releases,
# while scripts/validate_public_surface.sh declared 21 paths SOVEREIGN — so eight
# of them shipped in every wheel. `.gitattributes export-ignore` never applied
# here: it governs `git archive`, and hatchling builds from the VCS tree.
#
# Kept in sync with .withheld-modules.txt, which is the single source read by
# scripts/sovereign_surface_gate.py (which fails a built artifact carrying one)
# and by validate_public_surface.sh. tests/test_packaging_excludes.py asserts
# this block and that file agree, so they cannot drift apart again.
# force-include the user docs: `packages` only picks up src/, so a doc outside
# it never reaches the wheel however it is listed.
force-include = { "docs/QUICK_START.md" = "mcp_server_nucleus/docs/QUICK_START.md", "docs/RABBITHOLE.md" = "mcp_server_nucleus/docs/RABBITHOLE.md" }
exclude = [
    "src/mcp_server_nucleus/sovereign/",
    "src/mcp_server_nucleus/siphon.py",
    "src/mcp_server_nucleus/distill.py",
    "src/mcp_server_nucleus/replay.py",
    "src/mcp_server_nucleus/validate.py",
]

# sdist defaults to "everything in the repo" — fence to the source-build-needed set.
# Prior v1.13.0 release uploaded a 691 MiB sdist (Claude worktrees + node_modules + wasm).
# only-include keeps the archive at ~1-2 MiB while remaining buildable end-to-end.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    # The two documents README.md links to. Measured 2026-09-19: they were in
    # neither the wheel nor the sdist, so every installer read a README pointing
    # at files that do not exist, and the only .md in the wheel were internal
    # agent charter templates. 476 source files and no usable documentation.
    "docs/QUICK_START.md",
    "docs/RABBITHOLE.md",
]
# only-include takes src/ wholesale, so the withheld set has to be subtracted
# here too or the sdist ships what the wheel no longer does.
exclude = [
    "src/mcp_server_nucleus/sovereign/",
    "src/mcp_server_nucleus/siphon.py",
    "src/mcp_server_nucleus/distill.py",
    "src/mcp_server_nucleus/replay.py",
    "src/mcp_server_nucleus/validate.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end integration tests",
    "timeout: override default test timeout",
    "release: release-hygiene gates (wheel completeness, stranger first-run acceptance); not part of the default merge suite",
]

[tool.coverage.run]
branch = true
source = ["src/mcp_server_nucleus"]
omit = ["**/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. Without `select`, the effective rules are whatever
# the installed ruff release happens to default to, so a new ruff turned the CI
# gate red with ~7293 findings against rules this project never opted into, while
# the same command locally reported 5. These four are ruff's historical default
# and the set the `ignore` list below was written against.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E712", "E741", "F841", "E722", "E702", "F401", "F541", "E401", "E731", "F403", "F405", "F811", "F821"]

